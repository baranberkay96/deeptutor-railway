
; ---- Added by the Railway template (services/deeptutor/Dockerfile) ----
; When the backend or frontend keeps failing on start, supervisord marks it
; FATAL and stops retrying while staying up itself. This listener then stops
; supervisord, the container exits, and Railway's restart policy starts a
; fresh container instead of leaving a half-dead service running.
[eventlistener:railway_fatal_exit]
command=/usr/local/bin/python /opt/railway/supervisor_fatal_exit.py
events=PROCESS_STATE_FATAL
autostart=true
autorestart=true
startsecs=0
stdout_logfile=NONE
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
